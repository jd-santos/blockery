---
name: Validate

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run fixture tests
        run: python -m unittest discover -s tests -v

      - name: Validate source and plans
        run: python scripts/validate_pack.py

      # Use the documented build toolchain, not an upstream minimum or @latest.
      - name: Set up Go
        # v5.5.0
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install the documented Packwiz revision
        run: |
          test "$(go env GOVERSION)" = "go1.27.1"
          mkdir -p "$RUNNER_TEMP/packwiz/bin"
          GOBIN="$RUNNER_TEMP/packwiz/bin" \
            go install github.com/packwiz/packwiz@ef87d964f8cb
          go version -m "$RUNNER_TEMP/packwiz/bin/packwiz" \
            | tee "$RUNNER_TEMP/packwiz-build-info.txt"
          awk '$1 == "mod" &&
            $2 == "github.com/packwiz/packwiz" &&
            $3 == "v0.0.0-20260906154125-ef87d964f8cb" {found=1}
            END {exit !found}' "$RUNNER_TEMP/packwiz-build-info.txt"
          echo "$RUNNER_TEMP/packwiz/bin" >> "$GITHUB_PATH"

      - name: Build all draft distributions
        run: |
          for profile in \
            blockery-client \
            blockery-extras-client \
            blockery-server-survival \
            blockery-server-creative; do
            python scripts/build_pack.py build "$profile" \
              --version "$VERSION" --draft
          done

      - name: Audit draft archives
        run: python -m scripts.check_exports --version "$VERSION"

      - name: Check source immutability
        run: |
          git diff --exit-code
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            git status --short
            exit 1
          fi

      - name: Upload draft archives and audit files
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blockery-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local/dist/blockery-client-${{ env.VERSION }}-draft.mrpack
            local/dist/blockery-extras-client-${{ env.VERSION }}-draft.mrpack
            local/dist/blockery-server-survival-${{ env.VERSION }}-draft.mrpack
            local/dist/blockery-server-creative-${{ env.VERSION }}-draft.mrpack
            local/dist/SHA256SUMS
            local/dist/ci-report.json
          if-no-files-found: error
          retention-days: 7

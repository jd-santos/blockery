# Explicit build recipes, not native Packwiz profiles.
# Server drafts include reviewed shared gameplay configs. Client drafts omit configs.
# Blockery Client is the everyday base; Blockery Extras Client adds tools and visuals.

[profiles.blockery-client]
name = "Blockery Client"
side = "client"
mods = [
  "mods/appleskin.pw.toml",
  "mods/fabric-api.pw.toml",
  "mods/ferrite-core.pw.toml",
  "mods/immediatelyfast.pw.toml",
